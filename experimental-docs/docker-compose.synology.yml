# Experimental Navidrome fork. Run from the ROOT of the extracted source tree:
# docker compose --env-file experimental-docs/.env -f experimental-docs/docker-compose.synology.yml up -d --build
# IMPORTANT: replace the two /volume1/... paths to match your Synology NAS.
services:
  navidrome-experimental:
    build:
      context: ..
      dockerfile: Dockerfile
      target: final
    image: navidrome:collections-resume-m3u-alpha
    container_name: navidrome-experimental
    ports:
      - "4534:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_AUTOIMPORTPLAYLISTS: "true"
      ND_PLAYLISTSPATH: "playlist" # UI selection overrides after restarting
      ND_EXPERIMENTALM3UROOT: /m3u-write
    volumes:
      # Do not reuse the production Navidrome /data directory.
      - ./test-data:/data
      - "${SYNOLOGY_MUSIC_FOLDER:-/volume1/cloud/music archive}:/music:ro"
      # This mount permits writing to the Audio Station M3U files.
      # Back up the entire playlist folder before enabling it.
      - "${SYNOLOGY_PLAYLIST_FOLDER:-/volume1/cloud/music archive/playlist}:/m3u-write:rw"
    restart: unless-stopped
